<script>
    function appendMessage(sender, text, className) {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const text = inputField.value.trim();
        
        if (!text) return;
        
        appendMessage("Bro", text, "user");
        inputField.value = "";
        
        // Optional: show a temporary "thinking" message
        const thinkingId = "thinking-" + Date.now();
        const chatBox = document.getElementById("chat-box");
        const loadingDiv = document.createElement("div");
        loadingDiv.id = thinkingId;
        loadingDiv.className = "message jarvis";
        loadingDiv.innerHTML = `<strong>J.A.R.V.I.S.:</strong> Processing command...`;
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // NOTE: For a production app, you'd want this going through a backend server 
            // to keep your API key secure. For quick testing, you can place your key below.
            const apiKey = "YOUR_API_KEY_HERE"; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: "You are J.A.R.V.I.S., Tony Stark's AI assistant. Answer concisely and stay in character. User input: " + text
                        }]
                    }]
                })
            });

            const data = await response.json();
            
            // Remove the loading message
            document.getElementById(thinkingId).remove();

            // Extract the AI's reply
            const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Systems encountered an error processing that request, Bro.";
            
            appendMessage("J.A.R.V.I.S.", aiReply, "jarvis");

        } catch (error) {
            document.getElementById(thinkingId).remove();
            appendMessage("J.A.R.V.I.S.", "Network error: Unable to connect to core systems.", "jarvis");
        }
    }

    document.getElementById("user-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>
